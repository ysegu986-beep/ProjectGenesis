<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Project Genesis Prototype</title>
    <link rel="stylesheet" href="/app/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <h1>Project Genesis</h1>
          <p id="game-status">読み込み中</p>
        </div>
        <div class="topbar-actions">
          <button id="new-game" type="button">新しい対戦</button>
          <button id="next-phase" type="button">次のフェーズ</button>
          <button id="end-turn" type="button">ターン終了</button>
        </div>
      </header>

      <section class="guide-panel">
        <div class="phase-track" id="phase-track"></div>
        <div class="current-guide" id="phase-guide">準備中</div>
      </section>

      <section class="scoreboard" id="scoreboard"></section>

      <section class="battlefield" id="battlefield"></section>

      <aside class="log-panel">
        <div class="panel-heading">
          <h2>ログ</h2>
          <button id="clear-log" type="button">消す</button>
        </div>
        <ol id="game-log"></ol>
      </aside>
    </main>

    <dialog id="choice-dialog">
      <form method="dialog">
        <h2 id="choice-title">選択</h2>
        <div id="choice-list" class="choice-list"></div>
        <menu>
          <button value="cancel">キャンセル</button>
        </menu>
      </form>
    </dialog>

    <script type="module" src="/app/app.js"></script>
  </body>
</html>
