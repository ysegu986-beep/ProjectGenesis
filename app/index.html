<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Project Genesis Prototype</title>
    <link rel="stylesheet" href="/app/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <h1>Project Genesis</h1>
          <p id="game-status">読み込み中</p>
        </div>
        <div class="header-controls">
          <label>
            デッキ
            <select id="deck-select">
              <option value="0">火自然アグロ</option>
              <option value="1">水光コントロール</option>
            </select>
          </label>
          <button id="new-game" class="header-action" type="button">新しい対戦</button>
        </div>
      </header>

      <section class="scoreboard" id="scoreboard"></section>

      <aside class="topbar-actions" aria-label="ゲーム操作">
        <button id="auto-pay" type="button" aria-pressed="false">自動支払い OFF</button>
        <button id="skip-mana" type="button">マナパス</button>
        <button id="next-phase" type="button">次のフェーズ</button>
        <button id="end-turn" type="button">ターン終了</button>
        <button id="expand-log" type="button">ログ</button>
      </aside>

      <section class="battlefield" id="battlefield"></section>
    </main>

    <dialog id="choice-dialog">
      <form method="dialog">
        <h2 id="choice-title">選択</h2>
        <div id="choice-list" class="choice-list"></div>
        <menu>
          <button value="cancel">キャンセル</button>
        </menu>
      </form>
    </dialog>

    <dialog id="log-dialog">
      <form method="dialog">
        <h2>ログ</h2>
        <ol id="full-game-log" class="full-game-log"></ol>
        <menu>
          <button id="clear-log" type="button">消す</button>
          <button value="close">閉じる</button>
        </menu>
      </form>
    </dialog>

    <script type="module" src="/app/app.js"></script>
  </body>
</html>
